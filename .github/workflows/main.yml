name: Geotab Supabase Sync

"on":
  workflow_dispatch:
    inputs:
      modo:
        description: "Tabela a sincronizar"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cadastro
          - status
          - comportamento

  schedule:
    # CADASTRO: 1x/dia, seg-sex, 07:00 BRT (10:00 UTC)
    - cron: "0 10 * * 1-5"

    # STATUS: 10x/dia, seg-sex, 06:00 ~ 19:00 BRT
    - cron: "0 6 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "30 18 * * 1-5"
    
    # COMPORTAMENTO: 1x/dia, seg-sex, 20:00 BRT (23:00 UTC)
    - cron: "0 23 * * 1-5"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Determinar modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODO=${{ github.event.inputs.modo }}" >> $GITHUB_ENV
          else
            H=$(date -u +%H)
            M=$(date -u +%M)
            if [ "$H" = "10" ] && [ "$M" = "00" ]; then
              echo "MODO=cadastro" >> $GITHUB_ENV
            elif [ "$H" = "23" ]; then
              echo "MODO=comportamento" >> $GITHUB_ENV
            else
              echo "MODO=status" >> $GITHUB_ENV
            fi
          fi

      - name: Executar sync
        env:
          GEOTAB_SERVIDOR:  ${{ secrets.GEOTAB_SERVIDOR }}
          GEOTAB_DATABASE:  ${{ secrets.GEOTAB_DATABASE }}
          GEOTAB_USERNAME:  ${{ secrets.GEOTAB_USERNAME }}
          GEOTAB_PASSWORD:  ${{ secrets.GEOTAB_PASSWORD }}
          SUPABASE_HOST:    ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORTA:   ${{ secrets.SUPABASE_PORTA }}
          SUPABASE_BANCO:   ${{ secrets.SUPABASE_BANCO }}
          SUPABASE_USUARIO: ${{ secrets.SUPABASE_USUARIO }}
          SUPABASE_SENHA:   ${{ secrets.SUPABASE_SENHA }}
        run: python geotab_supabase.py ${{ env.MODO }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: geotab_sync.log
          retention-days: 7
