services:
  - type: web
    name: geotab-sync
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 600
    healthCheckPath: /health
    envVars:
      - key: GEOTAB_SERVIDOR
        sync: false
      - key: GEOTAB_DATABASE
        sync: false
      - key: GEOTAB_USERNAME
        sync: false
      - key: GEOTAB_PASSWORD
        sync: false
      - key: SUPABASE_HOST
        sync: false
      - key: SUPABASE_PORTA
        sync: false
      - key: SUPABASE_BANCO
        sync: false
      - key: SUPABASE_USUARIO
        sync: false
      - key: SUPABASE_SENHA
        sync: false
      - key: SYNC_API_KEY
        sync: false
      # Proxy de saída p/ contornar o bloqueio de WAF da Geotab no IP do Render.
      # Ex.: http://user:senha@host:porta. Vazio = conexão direta (uso local).
      - key: GEOTAB_PROXY
        sync: false
